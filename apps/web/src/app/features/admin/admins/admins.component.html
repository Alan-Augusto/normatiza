<div class="space-y-4">
  <div class="flex justify-end">
    <p-button data-testid="conceder" label="Conceder acesso" (onClick)="abrirConcessao()" />
  </div>

  @if (erro()) {
    <p-message data-testid="erro" severity="error" styleClass="w-full" [text]="erro()!" />
  }

  <app-data-table
    [dados]="admins()"
    [carregando]="carregando()"
    vazio="Nenhum administrador cadastrado."
    vazioDetalhe="Um sistema sem nenhum admin só se recupera com acesso ao banco."
  >
    <ng-template appCabecalho>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Desde</th>
        <th>Situação</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template appLinha [appLinhaDe]="admins()" let-admin>
      <tr data-testid="linha" [attr.data-user]="admin.userId">
        <td class="font-medium text-surface-900 dark:text-surface-0">
          {{ admin.name }}
          @if (admin.userId === euMesmo()) {
            <span class="ml-1 text-xs font-normal text-muted-color">· você</span>
          }
        </td>

        <td>{{ admin.email }}</td>

        <!--
          Um booleano responderia "é admin?". A pergunta de uma auditoria de
          verdade é "desde quando, e por obra de quem" — e ninguém reconstrói
          isso depois.
        -->
        <td data-testid="concedido-em">{{ admin.grantedAt | date: 'dd/MM/yyyy' }}</td>

        <td>
          @if (admin.revokedAt) {
            <span
              class="rounded-full bg-surface-200 px-2 py-0.5 text-xs font-bold text-muted-color dark:bg-surface-800"
            >
              Revogado
            </span>
          } @else {
            <span class="rounded-full bg-success/15 px-2 py-0.5 text-xs font-bold text-success">
              Ativo
            </span>
          }
        </td>

        <td class="text-right">
          @if (podeRevogar(admin)) {
            <app-row-action
              data-testid="acao-revogar"
              icon="lucideShieldOff"
              label="Revogar acesso de admin"
              severity="danger"
              (acionar)="revogar(admin)"
            />
          }
        </td>
      </tr>
    </ng-template>
  </app-data-table>
</div>
