@if (contexto.inexistente()) {
  <div data-testid="equipamento-inexistente" class="space-y-3 rounded-lg border border-surface-200 p-6 dark:border-surface-700">
    <p class="font-medium text-surface-900 dark:text-surface-0">Este equipamento não foi encontrado.</p>
    <p class="text-sm text-muted-color">
      O endereço pode estar errado, ou a máquina foi excluída do inventário.
    </p>
    <a [routerLink]="voltar()" class="text-sm font-medium text-primary">Voltar para os equipamentos</a>
  </div>
} @else {
  <router-outlet></router-outlet>
}
