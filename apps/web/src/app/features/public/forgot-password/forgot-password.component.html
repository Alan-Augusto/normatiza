<div class="flex min-h-screen items-center justify-center bg-surface-50 px-4 py-12 dark:bg-surface-950">
  <div class="w-full max-w-sm">
    <header class="mb-8 text-center">
      <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Recuperar acesso</h1>
    </header>

    <div
      class="rounded-lg border border-surface-200 bg-surface-0 p-6 shadow-sm dark:border-surface-700 dark:bg-surface-900"
    >
      @if (enviado()) {
        <p data-testid="enviado" class="text-sm">
          Se esse e-mail estiver cadastrado, enviamos as instruções para redefinir a senha.
        </p>
      } @else {
        <form [formGroup]="form" (ngSubmit)="submit()">
          <p class="mb-4 text-sm text-muted-color">
            Informe o e-mail da sua conta. Enviaremos um link para você definir uma senha nova.
          </p>

          <label for="email" class="mb-2 block text-sm font-medium">E-mail</label>
          <input
            id="email"
            data-testid="email"
            type="email"
            autocomplete="username"
            formControlName="email"
            class="mb-4 w-full rounded-md border border-surface-300 bg-surface-0 px-3 py-2 text-sm outline-none focus:border-primary dark:border-surface-600 dark:bg-surface-800"
          />

          <button
            data-testid="submit"
            type="submit"
            [disabled]="enviando()"
            class="w-full rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-contrast disabled:opacity-60"
          >
            {{ enviando() ? 'Enviando…' : 'Enviar instruções' }}
          </button>
        </form>
      }

      <a
        routerLink="/login"
        class="mt-4 block text-center text-sm text-muted-color hover:text-primary"
      >
        Voltar para o login
      </a>
    </div>
  </div>
</div>
