<div class="flex min-h-screen items-center justify-center bg-surface-50 px-4 py-12 dark:bg-surface-950">
  <div class="w-full max-w-sm">
    <header class="mb-8 text-center">
      <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Definir nova senha</h1>
    </header>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="rounded-lg border border-surface-200 bg-surface-0 p-6 shadow-sm dark:border-surface-700 dark:bg-surface-900"
    >
      <label for="password" class="mb-2 block text-sm font-medium">Nova senha</label>
      <input
        id="password"
        data-testid="password"
        type="password"
        autocomplete="new-password"
        formControlName="password"
        class="mb-1 w-full rounded-md border border-surface-300 bg-surface-0 px-3 py-2 text-sm outline-none focus:border-primary dark:border-surface-600 dark:bg-surface-800"
      />
      <p class="mb-4 text-xs text-muted-color">Ao menos {{ tamanhoMinimo }} caracteres.</p>

      <label for="confirmation" class="mb-2 block text-sm font-medium">Repita a senha</label>
      <input
        id="confirmation"
        data-testid="confirmation"
        type="password"
        autocomplete="new-password"
        formControlName="confirmation"
        class="mb-4 w-full rounded-md border border-surface-300 bg-surface-0 px-3 py-2 text-sm outline-none focus:border-primary dark:border-surface-600 dark:bg-surface-800"
      />

      @if (form.hasError('senhasDiferentes') && form.touched) {
        <p data-testid="senhas-diferentes" role="alert" class="mb-4 text-sm text-danger">
          As duas senhas precisam ser iguais.
        </p>
      }

      @if (erro()) {
        <p data-testid="erro" role="alert" class="mb-4 rounded-md bg-danger/10 px-3 py-2 text-sm text-danger">
          {{ erro() }}
        </p>
      }

      <button
        data-testid="submit"
        type="submit"
        [disabled]="enviando()"
        class="w-full rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-contrast disabled:opacity-60"
      >
        {{ enviando() ? 'Salvando…' : 'Salvar senha' }}
      </button>

      <a routerLink="/login" class="mt-4 block text-center text-sm text-muted-color hover:text-primary">
        Voltar para o login
      </a>
    </form>
  </div>
</div>
