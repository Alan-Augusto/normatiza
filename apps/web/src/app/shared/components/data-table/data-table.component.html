@if (carregando()) {
  <!--
    Barras no lugar das linhas, e não um "Carregando…" centralizado: o desenho
    já mostra que ali vai nascer uma lista, e a tela não salta quando ela chega.
  -->
  <div
    data-testid="tabela-carregando"
    class="space-y-3 rounded-lg border border-surface-200 bg-surface-0 p-4 dark:border-surface-700 dark:bg-surface-900"
  >
    @for (linha of esqueleto(); track linha) {
      <p-skeleton height="1.75rem" />
    }
  </div>
} @else if (dados().length === 0) {
  <div
    data-testid="tabela-vazia"
    class="rounded-lg border border-dashed border-surface-300 bg-surface-0 px-6 py-12 text-center dark:border-surface-700 dark:bg-surface-900"
  >
    <p class="text-sm font-medium text-surface-900 dark:text-surface-0">{{ vazio() }}</p>

    @if (vazioDetalhe(); as detalhe) {
      <p class="mx-auto mt-1 max-w-md text-sm text-muted-color">{{ detalhe }}</p>
    }

    @if (acaoVazia(); as acao) {
      <div class="mt-5 flex justify-center">
        <ng-container *ngTemplateOutlet="acao.template" />
      </div>
    }
  </div>
} @else {
  <!-- Tabela larga rola dentro da própria caixa; a página nunca rola de lado. -->
  <div class="overflow-x-auto rounded-lg border border-surface-200 dark:border-surface-700">
    <p-table
      [value]="dados()"
      styleClass="p-datatable-sm"
      [tableStyle]="{ 'min-width': '100%' }"
      [rowGroupMode]="agrupando() ? 'subheader' : undefined"
      [groupRowsBy]="agruparPor()"
    >
      <ng-template pTemplate="header">
        <ng-container *ngTemplateOutlet="cabecalho().template" />
      </ng-template>

      @if (tituloDeGrupo(); as titulo) {
        <ng-template pTemplate="groupheader" let-item>
          <tr data-testid="titulo-de-grupo">
            <!--
              `colspan` alto de propósito: o navegador o limita ao número real
              de colunas, e a alternativa seria a tela informar quantas são —
              um número que passaria a ter de ser mantido em dia com o
              cabeçalho, e que ninguém lembraria de mexer ao acrescentar uma.
            -->
            <td colspan="99" class="bg-surface-50 dark:bg-surface-800">
              <ng-container *ngTemplateOutlet="titulo.template; context: { $implicit: item }" />
            </td>
          </tr>
        </ng-template>
      }

      <ng-template pTemplate="body" let-item>
        <ng-container *ngTemplateOutlet="linha().template; context: { $implicit: item }" />
      </ng-template>
    </p-table>
  </div>
}
