# Servidor do SPA + porta de entrada da API na MESMA origem.
#
# O "mesma origem" não é preferência de arquitetura: o cookie do refresh token
# é gravado com `Path=/auth` (docs/backend/autenticacao.md). Servir a API sob um
# prefixo `/api` faria o navegador guardar o cookie e nunca devolvê-lo — a
# sessão morreria a cada recarregamento, sem erro visível. Por isso os prefixos
# da API vivem na raiz, ao lado das rotas do Angular.

# O log de acesso diz **onde o tempo foi gasto**: `rt` é a requisição inteira
# vista pelo nginx; `urt`, só a resposta da API. `rt` alto com `urt` baixo é a
# rede entre o navegador e o nginx; os dois altos, a API. `cf` é o CF-Ray, que
# o painel da Cloudflare procura; `ip`, quem fez o pedido de verdade (o
# `remote_addr` é sempre o cloudflared). Uma requisição que o navegador
# abandona aparece com status 499.
log_format com_tempo '$time_iso8601 $status "$request" $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time '
                     'ip=$http_cf_connecting_ip cf=$http_cf_ray "$http_user_agent"';

# O Firebase Storage Emulator do servidor provisório, que roda no host, fora do
# Docker. `host.docker.internal` vem do `extra_hosts` do compose. Num `upstream`,
# o nome é resolvido pelo /etc/hosts na partida; num proxy_pass com variável,
# seria pelo DNS do Docker, que não conhece esse nome.
upstream emulador_storage {
    server host.docker.internal:9199;
}

server {
    # 8080 e não 80: a imagem nginx-unprivileged roda como usuário comum, que
    # não pode abrir portas abaixo de 1024.
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log com_tempo;

    root /usr/share/nginx/html;
    index index.html;

    # O Cloudflare Tunnel já comprime na saída, mas o salto túnel→nginx também
    # atravessa a rede em algumas topologias.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploads e payloads de análise. O padrão do nginx (1m) é apertado demais.
    client_max_body_size 20m;

    # ── Leitura dos arquivos do emulador ──────────────────────────────────────
    # Só em servidor com FIREBASE_STORAGE_EMULATOR_PUBLIC_URL apontando para cá
    # (docs/devops/deploy.md, "Arquivos"). O emulador não tem autenticação e
    # aceita gravar e apagar qualquer coisa: por aqui passa **só** a leitura de
    # um arquivo pelo nome — sem listagem, sem metadado, sem a API GCS, sem
    # escrita. A URL precisa bater inteira com
    #   /arquivos-emulador/v0/b/{bucket}/o/{objeto codificado}?alt=media
    # e é repassada crua ($request_uri): o nome do objeto vem com as barras
    # codificadas (%2F), e o nginx as decodificaria se normalizasse o caminho.
    # Sem emulador no host, a rota responde 502 e o resto do site segue igual.
    location ^~ /arquivos-emulador/ {
        limit_except GET { deny all; }

        # Captura nomeada, e não `set $x $1`: a posicional passa por escape e o
        # %2F chegaria ao emulador como %252F.
        if ($request_uri !~ "^/arquivos-emulador(?<objeto>/v0/b/[^/?]+/o/[^/?]+\?alt=media)$") {
            return 404;
        }

        proxy_pass http://emulador_storage$objeto;
        proxy_http_version 1.1;
        proxy_set_header Host       $proxy_host;
        proxy_set_header Connection "";
        # A URL não expira: que ao menos nenhum cache compartilhado a guarde.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=300" always;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    # Esta lista precisa espelhar os @Controller() da API. Hoje:
    #   auth, users, companies (e companies/:id/members), company-groups,
    #   memberships, invitations, platform/admins, machine-types (o inventário
    #   em si mora sob companies/:id/equipments e companies/:id/sectors)
    #
    # Prefixo novo na API entra aqui — sem ele, em produção a chamada recebe o
    # index.html em vez de JSON, e no ambiente local tudo parece funcionar.
    #
    # As telas têm URL em português e a API, em inglês (docs/web/arquitetura.md
    # §3) — é o que impede um @Controller de sequestrar uma tela. A exceção é
    # `/admin`, que é nome de tela: a API nunca usa esse prefixo.
    location ~ ^/(auth|users|companies|company-groups|memberships|invitations|platform|machine-types)(/|$) {
        # Resolver do Docker + proxy_pass com variável: sem isso o nginx resolve
        # `api` uma única vez, no boot, e se recusa a subir enquanto a API não
        # estiver de pé — um container reiniciando derrubaria o site inteiro.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://api:3000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }

    # ── Estáticos ────────────────────────────────────────────────────────────
    # O build usa `outputHashing: all`, então todo arquivo com hash no nome é
    # imutável por definição: o conteúdo mudar significa nome novo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html é o oposto: é ele que aponta para os bundles com hash novo.
    # Cacheá-lo serve a versão velha do app depois de um deploy bem-sucedido.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # Qualquer outra rota é do Angular Router (/app/..., /admin/..., /login).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
