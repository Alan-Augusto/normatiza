# Servidor do SPA + porta de entrada da API na MESMA origem.
#
# O "mesma origem" não é preferência de arquitetura: o cookie do refresh token
# é gravado com `Path=/auth` (docs/backend/autenticacao.md). Servir a API sob um
# prefixo `/api` faria o navegador guardar o cookie e nunca devolvê-lo — a
# sessão morreria a cada recarregamento, sem erro visível. Por isso os prefixos
# da API vivem na raiz, ao lado das rotas do Angular.

server {
    # 8080 e não 80: a imagem nginx-unprivileged roda como usuário comum, que
    # não pode abrir portas abaixo de 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O Cloudflare Tunnel já comprime na saída, mas o salto túnel→nginx também
    # atravessa a rede em algumas topologias.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploads e payloads de análise. O padrão do nginx (1m) é apertado demais.
    client_max_body_size 20m;

    # ── API ──────────────────────────────────────────────────────────────────
    # Esta lista precisa espelhar os @Controller() da API. Hoje:
    #   auth, users, companies/:id/members, memberships, invitations,
    #   platform/admins
    #
    # ATENÇÃO ao adicionar prefixo novo: um @Controller('admin') sequestraria a
    # rota /admin do Angular, e um @Controller('login') sequestraria a tela de
    # login. Prefixo novo na API entra aqui E é conferido contra app.routes.ts.
    location ~ ^/(auth|users|companies|memberships|invitations|platform)(/|$) {
        # Resolver do Docker + proxy_pass com variável: sem isso o nginx resolve
        # `api` uma única vez, no boot, e se recusa a subir enquanto a API não
        # estiver de pé — um container reiniciando derrubaria o site inteiro.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://api:3000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }

    # ── Estáticos ────────────────────────────────────────────────────────────
    # O build usa `outputHashing: all`, então todo arquivo com hash no nome é
    # imutável por definição: o conteúdo mudar significa nome novo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html é o oposto: é ele que aponta para os bundles com hash novo.
    # Cacheá-lo serve a versão velha do app depois de um deploy bem-sucedido.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # Qualquer outra rota é do Angular Router (/app/..., /admin/..., /login).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
